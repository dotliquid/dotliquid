name: CI

on:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ develop ]
  workflow_call:

env:
  # Update src/DotLiquid/DotLiquid.csproj default Version/PackageVersion to match major/minor version
  PackageVersion: 2.4.${{ github.run_number }}
  Version: 2.4.${{ github.run_number }}
  InformationalVersion: 2.4.${{ github.run_number }}+${{ github.sha }}

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            8.0.x
            6.0.x

      - name: Restore
        run: dotnet restore src/DotLiquid.sln --verbosity minimal

      - name: Build
        run: dotnet build src/DotLiquid.sln --configuration Release --no-restore --verbosity minimal

      - name: Test
        run: >-
          dotnet test src/DotLiquid.Tests/DotLiquid.Tests.csproj
          --configuration Release
          --no-build
          --verbosity minimal
          --logger "console;verbosity=minimal"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[DotLiquid]*"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # Pinned v6.0.2
        with:
          directory: TestResults
          fail_ci_if_error: false
          # No token needed: this is a public repo, so Codecov's tokenless upload (via GitHub OIDC) works
          # even for pull_request runs from forks, which otherwise would not have access to repo secrets.

      - name: Pack
        run: dotnet pack src/DotLiquid/DotLiquid.csproj --configuration Release --no-build --output build/pkg --include-symbols -p:SymbolPackageFormat=snupkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: build/pkg/*.*nupkg
          if-no-files-found: error
          compression-level: 0
