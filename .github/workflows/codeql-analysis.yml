name: "Code Analysis"

on:
    push:
        branches: [master]
    pull_request:
        # The branches below must be a subset of the branches above
        branches: [master]
    #schedule:
    #    - cron: "40 1 * * 4"
    workflow_dispatch: # Allow on demand execution

jobs:
    analyze:
        name: Build Verification
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ["csharp"]

        steps:
            - name: Checkout repository
              uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

            # Initializes the CodeQL tools for scanning.
            - name: Initialize CodeQL
              uses: github/codeql-action/init@8dca8a82e2fa1a2c8908956f711300f9c4a4f4f6 # v2
              with:
                  languages: ${{ matrix.language }}

            # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
            - name: Autobuild
              uses: github/codeql-action/autobuild@8dca8a82e2fa1a2c8908956f711300f9c4a4f4f6 # v2

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@8dca8a82e2fa1a2c8908956f711300f9c4a4f4f6 # v2
