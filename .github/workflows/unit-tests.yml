name: "Unit Tests"

on:
    push:
    pull_request:
        # The branches below must be a subset of the branches above
        branches: [master]
    workflow_dispatch: # Allow on demand execution

jobs:
    test-matrix:
        name: Test on ${{ matrix.framework }} / ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                framework: [net6.0, net7.0, net8.0]
                exclude:
                    # Exclude some combinations to reduce CI time if needed
                    - os: macos-latest
                      framework: net7.0
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            
            - name: Setup .NET
              uses: actions/setup-dotnet@v3
              with:
                  dotnet-version: |
                      6.0.x
                      7.0.x
                      8.0.x
            
            - name: Restore dependencies
              run: dotnet restore src/DotLiquid.sln
            
            - name: Build
              run: dotnet build src/DotLiquid.sln --configuration Release --no-restore
            
            - name: Test specific framework
              run: dotnet test src/DotLiquid.Tests/DotLiquid.Tests.csproj --configuration Release --no-build --framework ${{ matrix.framework }} --verbosity normal --logger "trx;LogFileName=${{ matrix.framework }}-${{ matrix.os }}.trx"
            
            - name: Upload test results
              uses: actions/upload-artifact@v3
              if: always()
              with:
                  name: test-results-${{ matrix.framework }}-${{ matrix.os }}
                  path: "**/*.trx"
    
    # Keep the existing workflow call for backward compatibility
    test-legacy:
        name: Unit Tests (Legacy)
        uses: ./.github/workflows/build_verification_dotnet.yml
        with:
            project_path: ./src
            use_submodules: false
            run_tests: true
        secrets: inherit